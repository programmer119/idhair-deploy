<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5f1">
  <meta id="robotsMeta" name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
  <meta id="descriptionMeta" name="description" content="idHAIR 고객 설문·운영 관리 시스템. 태블릿·모바일·PC 설문, 지점·디자이너별 고객 데이터 관리, XLSX 내보내기, 권한·양식·QR·백업·감사 로그를 한 흐름으로 확인할 수 있습니다.">
  <meta name="application-name" content="idHAIR">
  <title>idHAIR 고객 설문·운영 관리 시스템</title>
  <style>
    html, body, #idhair-app { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: #f7f5f1; font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif; }
    #idhair-app { display: block; border: 0; background: #fff; }
    #idhair-app[hidden], #status[hidden] { display: none !important; }
    #status { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; font-size: 16px; text-align: center; color: #3e454b; background: #f7f5f1; z-index: 2; }
    #sf-attribution {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 4;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      max-width: calc(100vw - 28px);
      padding: 8px 11px;
      border: 1px solid rgba(20, 24, 31, .14);
      border-radius: 12px;
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 8px 26px rgba(20, 24, 31, .14);
      color: #171a20;
      text-decoration: none;
      font-size: 11px;
      line-height: 1.25;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    #sf-attribution img { width: 22px; height: 22px; display: block; }
    #sf-attribution span { display: grid; gap: 1px; }
    #sf-attribution strong { font-size: 12px; letter-spacing: -.01em; }
    #sf-attribution small { color: #656b73; font-size: 10px; }
    @media (max-width: 640px) {
      #sf-attribution { right: 10px; bottom: 10px; padding: 7px 9px; }
      #sf-attribution small { display: none; }
    }
  </style>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const portfolioMode = params.get('potpolio') === '1';
      window.IDHAIR_PRESENTATION_MODE = portfolioMode ? 'portfolio' : 'standard';
      document.documentElement.dataset.presentationMode = window.IDHAIR_PRESENTATION_MODE;

      const robots = document.getElementById('robotsMeta');
      const description = document.getElementById('descriptionMeta');

      if (portfolioMode) {
        document.title = 'idHAIR 고객 설문·운영 관리 시스템';
        robots.setAttribute('content', 'noindex,nofollow,noarchive,nosnippet');
        return;
      }

      document.title = 'idHAIR 고객 설문·운영 관리 시스템 | SuaveForge 프로젝트';
      description.setAttribute('content', 'SuaveForge가 구현한 idHAIR 다지점 고객 설문·운영 관리 시스템. 태블릿·모바일·PC 설문, 지점·디자이너별 데이터 관리, XLSX 내보내기, 3단계 권한, 양식 버전, QR 배포, 백업과 감사 로그를 연결한 웹·API 프로젝트입니다.');

      const canonical = document.createElement('link');
      canonical.rel = 'canonical';
      canonical.href = 'https://idhair.suaveforge.com/';
      document.head.appendChild(canonical);

      const meta = (property, content) => {
        const element = document.createElement('meta');
        if (property.startsWith('og:')) element.setAttribute('property', property);
        else element.setAttribute('name', property);
        element.setAttribute('content', content);
        document.head.appendChild(element);
      };

      meta('author', 'SuaveForge');
      meta('og:type', 'website');
      meta('og:site_name', 'SuaveForge');
      meta('og:title', 'idHAIR 고객 설문·운영 관리 시스템 | SuaveForge');
      meta('og:description', description.getAttribute('content'));
      meta('og:url', 'https://idhair.suaveforge.com/');
      meta('twitter:card', 'summary');
      meta('twitter:title', 'idHAIR 고객 설문·운영 관리 시스템 | SuaveForge');
      meta('twitter:description', description.getAttribute('content'));

      const schema = document.createElement('script');
      schema.type = 'application/ld+json';
      schema.text = JSON.stringify({
        '@context': 'https://schema.org',
        '@graph': [
          {
            '@type': 'WebApplication',
            '@id': 'https://idhair.suaveforge.com/#application',
            name: 'idHAIR 고객 설문·운영 관리 시스템',
            url: 'https://idhair.suaveforge.com/',
            applicationCategory: 'BusinessApplication',
            operatingSystem: 'Web',
            description: description.getAttribute('content'),
            featureList: [
              '태블릿·모바일·PC 반응형 고객 설문',
              '지점·디자이너·기간별 고객 데이터 검색',
              'XLSX 데이터 내보내기',
              '3단계 사용자 권한 관리',
              '설문 양식 버전 및 QR 배포',
              '백업·복구 및 감사 로그'
            ],
            creator: {
              '@type': ['Organization', 'ProfessionalService'],
              '@id': 'https://suaveforge.com/#organization',
              name: 'SuaveForge',
              url: 'https://suaveforge.com/'
            },
            isBasedOn: {
              '@type': 'CreativeWork',
              name: '미용실 100개 지점 고객 설문 디지털화 및 데이터 관리 시스템',
              url: 'https://suaveforge.com/work/idhair/'
            }
          },
          {
            '@type': 'Organization',
            '@id': 'https://suaveforge.com/#organization',
            name: 'SuaveForge',
            url: 'https://suaveforge.com/',
            sameAs: ['https://kmong.com/@SUAVEFORGE']
          }
        ]
      });
      document.head.appendChild(schema);
    })();
  </script>
</head>
<body>
  <div id="status">idHAIR 설문 시스템에 연결하고 있습니다.</div>
  <iframe id="idhair-app" title="idHAIR 고객 설문" hidden></iframe>
  <script src="config.js"></script>
  <script>
    (() => {
      const base = String(window.IDHAIR_API_BASE || '').replace(/\/$/, '');
      const frame = document.getElementById('idhair-app');
      const status = document.getElementById('status');
      const portfolioMode = window.IDHAIR_PRESENTATION_MODE === 'portfolio';

      if (!/^https:\/\//.test(base)) {
        status.textContent = '서비스 주소 설정을 확인해 주세요.';
        return;
      }

      if (!portfolioMode) {
        const attribution = document.createElement('a');
        attribution.id = 'sf-attribution';
        attribution.href = 'https://suaveforge.com/work/idhair/';
        attribution.target = '_blank';
        attribution.rel = 'author noopener';
        attribution.setAttribute('aria-label', 'SuaveForge idHAIR 프로젝트 상세 보기');

        const mark = document.createElement('img');
        mark.src = 'https://suaveforge.com/assets/suaveforge-mark.svg';
        mark.alt = 'SuaveForge';
        mark.width = 22;
        mark.height = 22;

        const label = document.createElement('span');
        const brand = document.createElement('strong');
        brand.textContent = 'Developed by SuaveForge';
        const detail = document.createElement('small');
        detail.textContent = '다지점 설문·고객관리 프로젝트';
        label.append(brand, detail);
        attribution.append(mark, label);
        document.body.appendChild(attribution);
      }

      frame.addEventListener('load', () => {
        frame.hidden = false;
        status.hidden = true;
        status.remove();
      }, { once: true });
      frame.src = `${base}/`;
      setTimeout(() => {
        if (frame.hidden) status.textContent = '서버 연결이 지연되고 있습니다. 잠시 후 새로고침해 주세요.';
      }, 15000);
    })();
  </script>
</body>
</html>
